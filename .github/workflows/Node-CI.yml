name: Node CI

on:
  push:

jobs:
  build:


    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check Node Version
        run: node --version

      - name: Check NPM version
        run: npm --version

      - name: Print Success 
        run: echo "CI Pipeline Running Successfully"

